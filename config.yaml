# Конфигурация ядра торгового бота Lineage 2 (драйвер окон торговли).
# Схема и дефолты: l2core/config.py. Частичный файл допустим:
# неупомянутые значения берутся из дефолтов кодом.
# Тайминги — в секундах, задержки HID — в миллисекундах.

timing:
  wait_default_timeout: 10.0  # таймаут wait_until по умолчанию
  verify_interval: 0.2  # интервал опроса predicate в wait_until
  hover_pause: 0.4  # пауза после hover до verify (тултип/подсветка элемента)
  click_retry_count: 2  # число повторов действия при неподтверждении эффекта

ocr:
  confidence_threshold: 0.85  # порог confidence OCR, [0, 1]
  reread_count: 2  # число перечитываний при низком conf/несовпадении значения

behavior:
  # Поведенческий профиль (антидетект): распределения и человеческие тайминги HID.
  numpad_fraction: 0.5  # доля ввода цены экранным нумпадом (клавиатура — остаток), [0, 1]
  enter_fraction: 0.5  # доля Enter против кнопки «Поиск», [0, 1]
  click_jitter_px: 3  # джиттер точки клика, пиксели
  move_jitter_px: 8  # джиттер траектории движения курсора, пиксели
  press_delay_min_ms: 40  # задержка нажатия кнопки мыши, мин
  press_delay_max_ms: 120  # ... макс
  key_delay_min_ms: 60  # пауза между клавишами, мин
  key_delay_max_ms: 180  # ... макс
  move_step_delay_min_ms: 8  # пауза между шагами траектории drag, мин
  move_step_delay_max_ms: 24  # ... макс
  drag_midpoints_min: 1  # промежуточные точки траектории drag (прямая + середины), мин
  drag_midpoints_max: 3  # ... макс

paths:
  model: crnn_best.pt  # чекпоинт CRNN (файл вне git, рядом с корнем репо)
  arduino_port: COM3  # порт HID-адаптера arduino

kill_switch:
  hotkey: ctrl+shift+k  # локальный хоткей мгновенной остановки (клавиатура, не arduino)
  inactivity_timeout: 300.0  # глобальный таймаут неактивности, сек

resolution:
  width: 1920  # референсное разрешение клиентской области игры
  height: 1080

window:
  title: Lineage II  # точный заголовок окна игры (подтвердить у владельца, Q18 docs/OWNER_QUESTIONS.md)
  class_name: null  # опциональный класс окна для фильтрации кандидатов

dry_run: false  # true: экран читается и состояние определяется, действия только логируются (без HID)
