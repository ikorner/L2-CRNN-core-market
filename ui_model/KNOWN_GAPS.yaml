# Известные незакрытые пробелы отгруженных UI-моделей (ruling R10).
#
# Тест tests/test_validator.py::test_shipped_models_match_known_gaps гоняет
# валидатор (l2core.model.validator) по ui_model/*.yaml и требует: каждое
# нарушение записано здесь, и каждая запись покрывает нарушение. Нарушение
# вне списка — падение CI; запись без нарушения (пробел закрыт, запись
# забыли убрать) — тоже падение. Запись закрывается правкой модели,
# а не вычёркиванием отсюда.
#
# Записи 2.2 (table_geometry для всех окон) закрыты задачей 2.4: геометрия
# размечена у market; у shop_buy/shop_sell текстовой таблицы нет (списки —
# иконные сетки), поэтому rule table_geometry_required к ним больше не
# применяется (WINDOWS_WITH_LISTS = ("market",)).
#
# Пробел вне правил валидатора (фиксируется здесь текстом, тест его не
# видит): таблицы «<Продажа>»/«<Покупка>» (история торговли лавки) — это
# ОТДЕЛЬНЫЕ окна, не смоделированные ни в одной модели; их кропы импортом
# 2.2 попали в shop_sell/shop_buy как HUD-элементы. Моделирование этих
# окон — владельцу (после 2.5).
gaps:
  # market: состояние из меты имеет одну template-сигнатуру; мета второй
  # признак не знает — доразметка (2.5).
  - {file: market.yaml, rule: state_signatures, subject: list__tab_home}
