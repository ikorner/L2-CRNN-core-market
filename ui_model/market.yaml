# UI-модель окна market. Импорт конвертером (l2core.model.converter) из base_screenshot/scr/meta.json.
# Политика слияния: ручные правки побеждают, машинное дополняет; diff-отчёт — `python -m l2core.model.converter`.
# rect'ы элементов батча scr_153901+ пересчитаны вручную от истинного якоря
# (202,103), а не эвристического (207,77) конвертера (задача 3.3b;
# guard-тест — tests/test_anchor.py::TestAnchorModelConsistency::test_market_batch2_rects_match_meta).
# table_geometry откалибрована из меты под 1920x1080 (задача 2.4, метод — в отчёте 2.4).
# Сигнатуры состояний и семантика подтверждённых переходов размечены (2.3-2.5,
# обоснование — в отчёте 2.5); OCR-регионы и неподтверждённая семантика —
# в KNOWN_GAPS.yaml и docs/OWNER_QUESTIONS.md.
