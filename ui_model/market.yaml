states:
  list__filter_all__global_filter_all__tab_equipment:
    params: {filter: all, global_filter: all, tab: equipment}
    signatures:
    - {kind: template, element: filter_button_all_active, variant: active}
    - {kind: template, element: snaryag_all_active, variant: active}
    - {kind: template, element: snaryg_active, variant: active}
    # Дискриминация global_filter (Q4, ответ владельца + досъёмка): кружок
    # «Все» заполнен, на «Продажа»/«Покупка» — пустые. Без этого признака
    # состояние ложно подтверждалось на чужом фильтре (0.930, KNOWN_GAPS
    # п. 4 до закрытия).
    - {kind: template, element: krujok_all_active, variant: active}
    # Подтаб «Все» активен: яркая рамка кнопки (Q5 — подтабы
    # template'ами не дискриминируются, кросс 0.95+; проба рамки
    # дельта 48 при допуске 16). Без пробы состояние ложно
    # подтверждалось на подтабах «Оружие»/«Броня»/«Аксессуары».
    - kind: pixel_probe
      points: [{at: [19, 209], color: [118, 103, 87]}]
