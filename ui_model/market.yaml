  list__tab_home:
    params: {tab: home}
    signatures:
    - {kind: template, element: market_main_button_active, variant: active}
    # Второй признак (пробел KNOWN_GAPS закрыт правкой модели): открытое
    # окно целиком, scr_153551 (мета второй признак не знала).
    - {kind: template, element: market_main_menu, variant: normal}
  recover_closed:
    # «Все окна торговли закрыты» (scr_153511, scr_all_close). Сигнатуры —
    # видимость HUD-иконок открытия (они импортированы в эту модель).
    # Состояние глобальное (не окна market), живёт здесь, т.к. HUD-иконки
    # импортом лежат в market.yaml; моделирование — вопрос владельцу (Q3,
    # docs/OWNER_QUESTIONS.md).
    params: {}
    signatures:
    - {kind: template, element: market_pic, variant: normal}
    - {kind: template, element: open_buy_trade, variant: normal}
# Семантика переходов (задача 2.5). Заполнены ТОЛЬКО переходы, подтверждённые
# метой/скриншотами (R4: в мете click_leads_to: null всюду). Обоснование по
# каждому переходу — в отчёте 2.5 и docs/OWNER_QUESTIONS.md. verify — наблюдаемые
# признаки целевого состояния; on_fail — локальные пассивные шаги (design,
# решение 6: ESC -> клик в свободную область); точная цепочка recover — рантайм
# 5.8. timeout не задан — берётся из конфига при исполнении.
transitions:
  # scr_153511 (окон нет, иконка на HUD) -> scr_153551 (tab=home активен).
  # ОТВЕТ ВЛАДЕЛЬЦА (Q2, приёмка): игра ЗАПОМИНАЕТ последний таб и страницу
  # скролла — повторное открытие показывает запомненное место, «Главная» —
  # только дефолт первого открытия. Поэтому verify перехода — универсальный
  # признак «окно открыто» (заголовок window_title, общий для всех табов),
  # а не признаки Главной: expected=list__tab_home — номинальная цель графа,
  # фактическое состояние определяет детектор (вызывающий слой НЕ
  # предполагает list__tab_home — см. OWNER_QUESTIONS Q2, следствия).
  - from: recover_closed
    action: click
    element: market_pic
    expected: list__tab_home
    verify:
      - {kind: template, element: window_title, variant: normal}
    on_fail: [press_esc, click_free_area]
  # scr_153551 (tab=home) -> scr_153600 (tab=equipment, фильтр «Все» активен).
  - from: list__tab_home
    action: click
    element: market_snar_passive
    expected: list__filter_all__global_filter_all__tab_equipment
    verify:
      - {kind: template, element: snaryg_active, variant: active}
      - {kind: template, element: filter_button_all_active, variant: active}
    on_fail: [press_esc, click_free_area]
  # scr_153600 (tab=equipment, фильтр «Все» активен) -> живой кадр
  # владельца (Q4, досъёмка 09.11.2025): клик по пассивной кнопке
  # «Продажа» переключает радио-группу глобальных фильтров — список
  # переключается на лавки «на продажу», кружок «Продажа» заполняется.
  - from: list__filter_all__global_filter_all__tab_equipment
    action: click
    element: filter_button_sell_passive
    expected: list__filter_all__global_filter_sell__tab_equipment
    verify:
      - {kind: template, element: krujok_sell_active, variant: active}
      - {kind: template, element: krujok_buy_passive, variant: normal}
    on_fail: [press_esc, click_free_area]
  # Аналогично «Покупка» (тот же живой кадр, Q4).
  - from: list__filter_all__global_filter_all__tab_equipment
    action: click
    element: filter_button_buy_passive
    expected: list__filter_all__global_filter_buy__tab_equipment
    verify:
      - {kind: template, element: krujok_buy_active, variant: active}
      - {kind: template, element: krujok_sell_passive, variant: normal}
    on_fail: [press_esc, click_free_area]
  # Радио-группа: переключение sell <-> buy напрямую (симметрия
  # подтверждённого механизма, семантика = «пассивная кнопка включается»).
  - from: list__filter_all__global_filter_sell__tab_equipment
    action: click
    element: filter_button_buy_passive
