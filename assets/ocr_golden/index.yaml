# Golden-набор OCR (task 4.6, spec ocr-reading «Golden-набор и OCR-бенчмарк»).
# Эталонные кропы с ИЗВЕСТНЫМ текстом: guard чтения обёртки (tests/
# test_ocr_golden.py) и OCR-бенчмарк (tools/benchmark_ocr.py).
#
# Критерий известности текста (ruling R4): текст читается человеком со
# скриншота-источника без сомнений и подтверждён визуальной проверкой
# нарезанного кропа. Описания meta.json — аннотации разметчика, НЕ ground
# truth: ни один expected text не взят из description меты.
#
# rect — пиксели скриншота-источника 1:1 (1920x1080). Кропы нарезаются
# инструментом tools/gen_ocr_golden.py (пересоздание: python tools/gen_ocr_golden.py);
# тест следит, что файлы совпадают с повторной нарезкой rect из сырья.
#
# grammar — грамматика OCR-регионов (common.yaml, задача 4.4): digits,
# price (разделители `,`/`.`, суффиксы `к`/`кк`), text. units — суффиксы-
# единицы, которые модель окна могла бы задать для отсечения (документация
# карточки, формат как в GrammarSpec types.py).
#
# Набор собран из 39 скринов сырья (base_screenshot/scr/). Досъёмка
# числовых кропов (цены лавок, «0 из N», адена) — на машине владельца с
# crnn_best.pt (docs/OWNER_QUESTIONS.md).
version: 1
criteria: >
  Текст читается человеком со скриншота-источника без сомнений
  и подтверждён визуальной проверкой нарезанного кропа; описания
  meta.json (аннотации на русском) ground truth не являются.
