[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "l2core"
version = "0.1.0"
description = "Ядро торгового бота Lineage 2: драйвер окон торговли"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "mss>=9.0.1",
    "torch>=2.0",
    "pygetwindow>=0.0.9",
    "pyserial>=3.5",
    "pywin32>=306",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
include = ["l2core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
